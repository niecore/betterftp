name: ftp_ramp_test
description: "FTP.TEST — Power Lab. Cycling FTP ramp test app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^1.1.1
  wakelock_plus: ^1.1.0
  flutter_blue_plus: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Iosevka
      fonts:
        - asset: assets/fonts/Iosevka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Iosevka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Iosevka-Bold.ttf
          weight: 700
        - asset: assets/fonts/Iosevka-Heavy.ttf
          weight: 900
